<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오목 AI - 승리 가이드</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;background:#121212;color:#fff;margin:0;padding:15px}
.container{position:relative;display:inline-block;margin-top:10px;user-select:none}
video{outline:2px solid #333;border-radius:8px;max-height:70vh;background:#000;display:block}
canvas#overlay{position:absolute;top:0;left:0;cursor:crosshair}
.controls{margin-bottom:8px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
button{padding:9px 16px;font-size:14px;cursor:pointer;border-radius:6px;border:none;font-weight:bold;transition:transform 0.1s}
button:active{transform:scale(0.96)}
label{font-size:12px;color:#aaa}
#status{margin-top:8px;color:#34c759;font-size:17px;font-weight:bold;min-height:26px}
#info{font-size:12px;color:#777;min-height:16px}
.my-turn{color:#ff3b30!important;font-size:21px!important;text-shadow:0 0 14px rgba(255,59,48,.8)}
.opp-turn{color:#8e8e93!important}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:999;justify-content:center;align-items:center}
.modal-box{background:#222;border:2px solid #007AFF;border-radius:12px;padding:25px 30px;box-shadow:0 0 30px rgba(0,122,255,0.4)}
.modal-box h2{margin:0 0 10px}.modal-box p{margin:0 0 20px;color:#aaa;font-size:14px}
.modal-btns{display:flex;gap:15px;justify-content:center}
.m-btn{padding:14px 22px;font-size:16px;border-radius:8px;border:2px solid #555;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<h1>오목 AI 실시간 승리 훈수기</h1>
<div class="controls">
  <button id="startBtn" style="background:#007AFF;color:#fff">1. 미러링 창 선택</button>
  <button id="reselectBtn" style="background:#333;color:#fff;display:none"></button>
  <button id="autoBtn" style="background:#1c7c3a;color:#fff">자동 인식</button>
  <button id="resetBtn" style="background:#444;color:#fff">영역 다시 그리기</button>
  <label>흑 민감도 <input type="range" id="bk" min="10" max="60" value="20"></label>
  <label>백 민감도 <input type="range" id="wk" min="20" max="120" value="70"></label>
  <label title="밝은 판에서 흰 돌 인식용">백 색차 <input type="range" id="kc" min="3" max="20" value="8"></label>
</div>
<div id="status">준비 완료! 파란 버튼을 눌러주세요.</div>
<div id="info"></div>
<div class="container"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div>
<canvas id="hc" style="display:none"></canvas>

<div id="stoneModal" class="modal-overlay">
  <div class="modal-box">
    <h2>당신은 어떤 돌인가요?</h2>
    <p>선택한 돌 기준으로 턴을 계산하고 상대를 압살하는 최적의 수를 안내합니다.</p>
    <div class="modal-btns">
      <button id="chooseBlack" class="m-btn" style="background:#000;color:#fff;border-color:#777">⚫️ 흑돌 (선공)</button>
      <button id="chooseWhite" class="m-btn" style="background:#fff;color:#000">⚪️ 백돌 (후공)</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('overlay'), ctx = canvas.getContext('2d');
const hc = $('hc'), hx = hc.getContext('2d', { willReadFrequently: true });
const statusText = $('status'), info = $('info'), modal = $('stoneModal');
const SIZE = 15;
const board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
let myColor = null, bestMove = null, isMyTurn = false;
let isDragging = false, dragStart = null, dragEnd = null, boardRect = null, isMatched = false;
let pending = '', boardNorm = null, hover = null, moveKey = '';

function say(t, cls = '') { statusText.className = cls; statusText.innerText = t; }

function selectStone(c) {
  myColor = c; modal.style.display = 'none';
  const b = $('reselectBtn'); b.style.display = 'inline-block';
  b.innerText = c === 1 ? '내 돌: [⚫️ 흑돌]' : '내 돌: [⚪️ 백돌]';
  pending = ''; processGame();
}
$('chooseBlack').onclick = () => selectStone(1);
$('chooseWhite').onclick = () => selectStone(2);
$('reselectBtn').onclick = () => modal.style.display = 'flex';
$('resetBtn').onclick = () => {
  boardRect = boardNorm = null; isMatched = false; bestMove = null; pending = '';
  say('바둑판의 [좌상단 교차점]에서 [우하단 교차점]까지 드래그하세요!');
};

$('startBtn').onclick = async () => {
  try {
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    video.play(); boardRect = boardNorm = null; isMatched = false; pending = '';
    say('🔍 바둑판을 자동 인식하는 중...');
    video.onloadeddata = () => setTimeout(autoBoard, 800);
  } catch (e) { alert('선택 취소 또는 에러: ' + e.message); }
};

const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
canvas.onmousedown = e => { dragStart = dragEnd = pos(e); isDragging = true; isMatched = false; };
canvas.onmousemove = e => { hover = pos(e); if (isDragging) dragEnd = hover; };
canvas.onmouseleave = () => hover = null;
canvas.onmouseup = () => {
  if (!isDragging) return; isDragging = false;
  const x = Math.min(dragStart.x, dragEnd.x), y = Math.min(dragStart.y, dragEnd.y);
  const w = Math.abs(dragEnd.x - dragStart.x), h = Math.abs(dragEnd.y - dragStart.y);
  if (w > 50 && h > 50) setBoardRect({ x, y, w, h });
};

function setBoardRect(rc) {
  boardRect = rc; isMatched = true; pending = '';
  boardNorm = { x: rc.x / canvas.width, y: rc.y / canvas.height, w: rc.w / canvas.width, h: rc.h / canvas.height };
  if (!myColor) modal.style.display = 'flex'; else say('✅ 영역 설정 완료');
}

function autoBoard() {
  if (!video.videoWidth) return;
  canvas.width = video.clientWidth; canvas.height = video.clientHeight;
  const r = detectBoard();
  if (!r) { say('⚠️ 자동 인식 실패 — [영역 다시 그리기]로 직접 지정하세요'); return; }
  const kx = video.videoWidth / video.clientWidth, ky = video.videoHeight / video.clientHeight;
  setBoardRect({ x: r.x / kx, y: r.y / ky, w: r.w / kx, h: r.h / ky });
}
$('autoBtn').onclick = autoBoard;

function detectBoard() {
  const W = video.videoWidth, H = video.videoHeight;
  hc.width = W; hc.height = H; hx.drawImage(video, 0, 0);
  const d = hx.getImageData(0, 0, W, H).data, g = new Float32Array(W * H);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) g[j] = d[i] + d[i + 1] + d[i + 2];
  const Lx = (y, x) => Math.abs(2 * g[y * W + x] - g[y * W + x - 2] - g[y * W + x + 2]);
  const Ly = (y, x) => Math.abs(2 * g[y * W + x] - g[(y - 2) * W + x] - g[(y + 2) * W + x]);
  const Px = new Float32Array(W), Py = new Float32Array(H);
  for (let y = 2; y < H - 2; y += 2) for (let x = 2; x < W - 2; x++) Px[x] += Lx(y, x);
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x += 2) Py[y] += Ly(y, x);
  const prep = P => {
    const q = new Float32Array(P.length);
    for (let i = 1; i < P.length - 1; i++) q[i] = Math.sqrt(Math.max(P[i - 1], P[i], P[i + 1]));
    const cap = 1.25 * Array.from(q).sort((a, b) => b - a)[20];
    return q.map(v => Math.min(v, cap));
  };
  const search = (Q, smin, smax) => {
    let best = { sc: -1, x0: 0, s: smin };
    for (let s = smin; s <= smax; s += 0.1) {
      const m0 = Math.floor(Q.length - 2 - 14 * s);
      for (let x0 = 0; x0 <= m0; x0++) {
        let sc = 0; for (let i = 0; i < 15; i++) sc += Q[Math.round(x0 + i * s)];
        if (sc > best.sc) best = { sc, x0, s };
      }
    }
    return best;
  };
  const refine = (P, x0, s) => {
    let sx = 0, sxi = 0;
    for (let i = 0; i < 15; i++) {
      let c = Math.min(Math.max(Math.round(x0 + i * s), 3), P.length - 4), bx = c, bv = -1;
      for (let k = -3; k <= 3; k++) if (P[c + k] > bv) { bv = P[c + k]; bx = c + k; }
      sx += bx; sxi += i * bx;
    }
    const b = (15 * sxi - 105 * sx) / (15 * 1015 - 105 * 105);
    return { a: (sx - b * 105) / 15, b };
  };
  const score = (a, b, c, e) => {
    const o = Math.max(3, Math.round(b * 0.25)); let t = 0;
    for (let j = 0; j < 15; j++) {
      const y = Math.round(c + j * e);
      for (let i = 0; i < 15; i++) {
        const x = Math.round(a + i * b);
        if (x < o + 4 || y < o + 4 || x >= W - o - 4 || y >= H - o - 4) return -1;
        let v = 0, h = 0;
        for (const sg of [-1, 1]) for (let k = -1; k <= 1; k++) { v = Math.max(v, Lx(y + sg * o, x + k)); h = Math.max(h, Ly(y + k, x + sg * o)); }
        t += Math.min(v, h);
      }
    }
    return t;
  };
  const sx = search(prep(Px), 10, Math.min(200, W / 14)), X = refine(Px, sx.x0, sx.s);
  const sy = search(prep(Py), X.b * 0.96, X.b * 1.04), Y = refine(Py, sy.x0, sy.s);
  let best = null;
  for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 2; dy++) {
    const a = refine(Px, X.a + dx * X.b, X.b), c = refine(Py, Y.a + dy * Y.b, Y.b), sc = score(a.a, a.b, c.a, c.b);
    if (!best || sc > best.sc) best = { sc, x: a.a, y: c.a, w: 14 * a.b, h: 14 * c.b };
  }
  return best && best.sc / 225 > 40 ? best : null;
}

function getCoord(r, c, rect = boardRect) {
  if (!rect) return { x: 0, y: 0 };
  return { x: rect.x + c * rect.w / (SIZE - 1), y: rect.y + r * rect.h / (SIZE - 1) };
}

function processGame() {
  if (!isMatched || !myColor || !video.videoWidth) return;
  if (hc.width !== video.videoWidth || hc.height !== video.videoHeight) { hc.width = video.videoWidth; hc.height = video.videoHeight; }
  hx.drawImage(video, 0, 0);
  const sx = video.videoWidth / video.clientWidth, sy = video.videoHeight / video.clientHeight;
  const stepPx = boardRect.w / (SIZE - 1) * sx, h = Math.max(1, Math.round(stepPx * 0.04)), off = Math.round(stepPx * 0.22), m = off + h;
  const vals = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const p = getCoord(r, c), px = Math.round(p.x * sx), py = Math.round(p.y * sy);
    if (px < m || py < m || px >= hc.width - m || py >= hc.height - m) { vals.push(null); continue; }
    const q = [];
    for (const [ax, ay] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const d = hx.getImageData(px + ax * off - h, py + ay * off - h, 2 * h + 1, 2 * h + 1).data;
      let sr = 0, sg = 0, sb = 0, n = d.length / 4;
      for (let i = 0; i < d.length; i += 4) { sr += d[i]; sg += d[i + 1]; sb += d[i + 2]; }
      q.push([(sr + sg + sb) / (3 * n), (sr - sb) / n]);
    }
    q.sort((a, b) => a[0] - b[0]);
    vals.push([(q[1][0] + q[2][0]) / 2, (q[1][1] + q[2][1]) / 2]);
  }
  const ok = vals.filter(v => v !== null);
  if (!ok.length) return;
  const med = ok.map(v => v[0]).sort((a, b) => a - b)[ok.length >> 1];
  const medC = ok.map(v => v[1]).sort((a, b) => a - b)[ok.length >> 1];
  const kb = +$('bk').value, kw = +$('wk').value, kc = +$('kc').value;

  const raw = vals.map(v => v === null ? 0 : v[0] < med - kb ? 1 : (v[0] > med + kw || (Math.abs(v[1] - medC) > kc && v[0] > med - 25)) ? 2 : 0);
  const sig = raw.join('');
  if (sig !== pending) { pending = sig; return; }
  let bc = 0, wc = 0;
  raw.forEach((v, i) => { board[i / SIZE | 0][i % SIZE] = v; if (v === 1) bc++; else if (v === 2) wc++; });
  info.innerText = `판 위 돌: 흑 ${bc}개, 백 ${wc}개`;

  const diff = bc - wc;
  const valid = (diff === 0 || diff === 1);
  isMyTurn = valid ? (myColor === 1 ? diff === 0 : diff === 1) : true;
  if (isMyTurn) {
    const key = sig + myColor;
    if (key !== moveKey) { moveKey = key; bestMove = computeMove(board, myColor); }
    const m = bestMove;
    const where = m ? `[세로 ${m.r + 1}번째 줄, 가로 ${m.c + 1}번째 줄]에 두세요!${m.why ? ' (' + m.why + ')' : ''}` : '둘 곳을 찾는 중...';
    say(valid ? `⚡️ 내 턴! ${where}` : `⚠️ 인식 확인 중: ${where}`, 'my-turn');
  } else {
    bestMove = null; moveKey = '';
    say('⏳ 상대방이 생각 중입니다... (돌을 놓으면 즉시 표시)', 'opp-turn');
  }
}

// ------------------- [완전 공백 뷰파인더 렌더링] -------------------
function renderLoop() {
  if (canvas.width !== video.clientWidth || canvas.height !== video.clientHeight) {
    canvas.width = video.clientWidth; canvas.height = video.clientHeight;
    if (boardNorm) boardRect = { x: boardNorm.x * canvas.width, y: boardNorm.y * canvas.height, w: boardNorm.w * canvas.width, h: boardNorm.h * canvas.height };
  }
  canvas.style.cursor = 'crosshair';
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (isDragging && dragStart && dragEnd) {
    const rc = { x: Math.min(dragStart.x, dragEnd.x), y: Math.min(dragStart.y, dragEnd.y), w: Math.abs(dragEnd.x - dragStart.x), h: Math.abs(dragEnd.y - dragStart.y) };
    ctx.strokeStyle = '#007AFF'; ctx.lineWidth = 2; ctx.strokeRect(rc.x, rc.y, rc.w, rc.h);
    ctx.strokeStyle = 'rgba(0,122,255,.5)'; ctx.lineWidth = 1;
    for (let i = 0; i < SIZE; i++) {
      const a = getCoord(0, i, rc), b = getCoord(SIZE - 1, i, rc), c = getCoord(i, 0, rc), d = getCoord(i, SIZE - 1, rc);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
    }
  }

  if (boardRect && isMatched) {
    const step = boardRect.w / (SIZE - 1);
    const rad = step * 0.38;

    // 1. 진짜 놓여진 돌만 표시
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const p = getCoord(r, c), v = board[r][c];
      ctx.beginPath();
      if (v) {
        ctx.fillStyle = v === 1 ? '#111' : '#fff';
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2.5;
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(0, 255, 120, 0.35)';
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 2. 바깥쪽 줄 번호 강조
    ctx.font = 'bold 11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    for (let i = 0; i < SIZE; i++) {
      const t = getCoord(0, i), l = getCoord(i, 0);
      const isTargetCol = bestMove && isMyTurn && bestMove.c === i;
      const isTargetRow = bestMove && isMyTurn && bestMove.r === i;

      ctx.fillStyle = isTargetCol ? '#ffcc00' : 'rgba(255,255,255,0.6)';
      if (isTargetCol) {
        ctx.beginPath(); ctx.arc(t.x, t.y - 10, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#ffcc00'; ctx.fill();
        ctx.fillStyle = '#000';
      }
      ctx.fillText(i + 1, t.x, t.y - 6);

      ctx.fillStyle = isTargetRow ? '#ffcc00' : 'rgba(255,255,255,0.6)';
      if (isTargetRow) {
        ctx.beginPath(); ctx.arc(l.x - 14, l.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#ffcc00'; ctx.fill();
        ctx.fillStyle = '#000';
      }
      ctx.fillText(i + 1, l.x - 14, l.y + 4);
    }

    // 3. [추천 위치: 원형/돌 그래픽 ZERO! 네모 괄호 꺾쇠 [  ] 와 화살표만 표시]
    if (bestMove && isMyTurn) {
      const p = getCoord(bestMove.r, bestMove.c);
      const time = Date.now() / 150;
      const pulse = (Math.sin(time) + 1) / 2;

      // [A] 가로·세로 조준선 (가운데 교차점은 비워둠)
      ctx.save();
      ctx.strokeStyle = `rgba(255, 59, 48, ${0.3 + pulse * 0.4})`;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      const leftEnd = getCoord(bestMove.r, 0), rightEnd = getCoord(bestMove.r, SIZE - 1);
      ctx.beginPath();
      ctx.moveTo(leftEnd.x, leftEnd.y); ctx.lineTo(p.x - rad - 8, p.y);
      ctx.moveTo(p.x + rad + 8, p.y); ctx.lineTo(rightEnd.x, rightEnd.y);
      ctx.stroke();

      const topEnd = getCoord(0, bestMove.c), bottomEnd = getCoord(SIZE - 1, bestMove.c);
      ctx.beginPath();
      ctx.moveTo(topEnd.x, topEnd.y); ctx.lineTo(p.x, p.y - rad - 8);
      ctx.moveTo(p.x, p.y + rad + 8); ctx.lineTo(bottomEnd.x, bottomEnd.y);
      ctx.stroke();
      ctx.restore();

      // [B] 카메라 뷰파인더 꺾쇠 [   ] (중심에는 단 1픽셀도 그리지 않음!)
      const boxD = rad + 3 + pulse * 4; // 중심에서 떨어진 거리
      const arm = 7;                    // 꺾쇠 길이
      ctx.strokeStyle = '#ff3b30';
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      // 좌상단 ┌
      ctx.moveTo(p.x - boxD + arm, p.y - boxD); ctx.lineTo(p.x - boxD, p.y - boxD); ctx.lineTo(p.x - boxD, p.y - boxD + arm);
      // 우상단 ┐
      ctx.moveTo(p.x + boxD - arm, p.y - boxD); ctx.lineTo(p.x + boxD, p.y - boxD); ctx.lineTo(p.x + boxD, p.y - boxD + arm);
      // 좌하단 └
      ctx.moveTo(p.x - boxD, p.y + boxD - arm); ctx.lineTo(p.x - boxD, p.y + boxD); ctx.lineTo(p.x - boxD + arm, p.y + boxD);
      // 우하단 ┘
      ctx.moveTo(p.x + boxD, p.y + boxD - arm); ctx.lineTo(p.x + boxD, p.y + boxD); ctx.lineTo(p.x + boxD - arm, p.y + boxD);
      ctx.stroke();

      // [C] 머리 위에서 통통 튀는 붉은 화살표 (🔻)
      const arrowY = p.y - boxD - 12 - pulse * 6;
      ctx.fillStyle = '#ff3b30';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - boxD - 3);         // 화살표 뾰족한 끝
      ctx.lineTo(p.x - 7, arrowY);             // 좌상단
      ctx.lineTo(p.x + 7, arrowY);             // 우상단
      ctx.closePath();
      ctx.fill();

      // [D] 상단 좌표 말풍선 배지
      const badgeText = `${bestMove.r + 1}행 ${bestMove.c + 1}열`;
      ctx.font = 'bold 12px sans-serif';
      const textW = ctx.measureText(badgeText).width;
      const bx = p.x - textW / 2 - 5, by = arrowY - 18;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.strokeStyle = '#ff3b30';
      ctx.lineWidth = 1.2;
      ctx.fillRect(bx, by, textW + 10, 18);
      ctx.strokeRect(bx, by, textW + 10, 18);

      ctx.fillStyle = '#ffeb3b';
      ctx.textAlign = 'center';
      ctx.fillText(badgeText, p.x, by + 13);
    }
  }

  requestAnimationFrame(renderLoop);
}

// ------------------- [그랜드마스터급 오목 AI 엔진] -------------------
const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
const inb = (r, c) => r >= 0 && r < SIZE && c >= 0 && c < SIZE;

function getPattern(board, r, c, dr, dc, color) {
  let count = 1, openEnds = 0;
  let step = 1;
  while (true) {
    const nr = r + dr * step, nc = c + dc * step;
    if (!inb(nr, nc)) break;
    if (board[nr][nc] === color) { count++; step++; }
    else if (board[nr][nc] === 0) { openEnds++; break; }
    else break;
  }
  step = 1;
  while (true) {
    const nr = r - dr * step, nc = c - dc * step;
    if (!inb(nr, nc)) break;
    if (board[nr][nc] === color) { count++; step++; }
    else if (board[nr][nc] === 0) { openEnds++; break; }
    else break;
  }
  return { count, openEnds };
}

function evaluateCell(board, r, c, color) {
  let score = 0;
  let openFours = 0, fours = 0, openThrees = 0, threes = 0;

  for (const [dr, dc] of DIRS) {
    const { count, openEnds } = getPattern(board, r, c, dr, dc, color);

    if (count >= 5) score += 10000000;
    else if (count === 4) {
      if (openEnds === 2) { score += 1000000; openFours++; }
      else if (openEnds === 1) { score += 150000; fours++; }
    } else if (count === 3) {
      if (openEnds === 2) { score += 80000; openThrees++; }
      else if (openEnds === 1) { score += 5000; threes++; }
    } else if (count === 2) {
      if (openEnds === 2) score += 2000;
      else if (openEnds === 1) score += 200;
    }
  }

  if (openFours >= 1 || fours >= 2) score += 500000;
  if (fours >= 1 && openThrees >= 1) score += 300000;
  if (openThrees >= 2) score += 150000;

  return score;
}

function isDoubleThreeFoul(board, r, c, color) {
  if (color !== 1) return false;
  board[r][c] = color;
  let open3Count = 0;
  for (const [dr, dc] of DIRS) {
    const { count, openEnds } = getPattern(board, r, c, dr, dc, color);
    if (count === 3 && openEnds === 2) open3Count++;
  }
  board[r][c] = 0;
  return open3Count >= 2;
}

function hasFiveFrom(board, r, c, color) {
  for (const [dr, dc] of DIRS) {
    let n = 1;
    for (const sign of [-1, 1]) {
      let rr = r + dr * sign, cc = c + dc * sign;
      while (inb(rr, cc) && board[rr][cc] === color) {
        n++; rr += dr * sign; cc += dc * sign;
      }
    }
    if (n >= 5) return true;
  }
  return false;
}

function winningMoves(board, color, candidatesOnly = false) {
  const wins = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (board[r][c] !== 0) continue;
    if (candidatesOnly) {
      let near = false;
      for (let dr = -2; dr <= 2 && !near; dr++)
        for (let dc = -2; dc <= 2 && !near; dc++) {
          const rr = r + dr, cc = c + dc;
          if (inb(rr, cc) && board[rr][cc] !== 0) near = true;
        }
      if (!near) continue;
    }
    board[r][c] = color;
    const won = hasFiveFrom(board, r, c, color);
    board[r][c] = 0;
    if (won) wins.push({r, c});
  }
  return wins;
}

function computeMove(board, me) {
  const op = 3 - me;
  if (board.every(row => row.every(v => !v))) return {r: 7, c: 7, why: '중앙 선점'};

  // 1) If a legal immediate win exists, take it.
  const myWins = winningMoves(board, me, true)
    .filter(p => !isDoubleThreeFoul(board, p.r, p.c, me));
  if (myWins.length) return {...myWins[0], why: '★ 지금 이기는 수'};

  // 2) Enumerate all immediate opponent wins, not just a heuristic score.
  const opWins = winningMoves(board, op, true);
  if (opWins.length === 1) return {...opWins[0], why: '상대의 즉시 승리 차단'};
  // If two or more independent winning points exist, one block cannot stop them all.
  // Prefer a forcing move that wins now (handled above), otherwise prioritize creating
  // our own threat and clearly report the danger.
  const candidates = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (board[r][c] !== 0) continue;
    let near = false;
    for (let dr = -2; dr <= 2 && !near; dr++) for (let dc = -2; dc <= 2 && !near; dc++) {
      const rr = r + dr, cc = c + dc;
      if (inb(rr, cc) && board[rr][cc] !== 0) near = true;
    }
    if (near && !isDoubleThreeFoul(board, r, c, me)) candidates.push({r,c});
  }
  if (!candidates.length) {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++)
      if (board[r][c] === 0) candidates.push({r,c});
  }

  let best = null, bestScore = -Infinity;
  for (const {r,c} of candidates) {
    // Score both sides' resulting patterns after simulating the move.
    board[r][c] = me;
    const attack = evaluateCell(board, r, c, me);
    const ownWinsNext = winningMoves(board, me, true).length;
    board[r][c] = 0;

    board[r][c] = op;
    const defense = evaluateCell(board, r, c, op);
    board[r][c] = 0;

    // Strongly favor creating immediate winning threats, then block opponent threats.
    let score = attack + defense * 2.4 + ownWinsNext * 1800000;
    if (opWins.length >= 2) score += attack * 0.5;
    score += (14 - Math.abs(r - 7) - Math.abs(c - 7)) * 10;

    // Avoid moves that leave an immediate opponent win, where another move can prevent it.
    board[r][c] = me;
    const replies = winningMoves(board, op, true);
    board[r][c] = 0;
    if (replies.length) score -= 25000000 + replies.length * 1000000;

    if (score > bestScore) {
      bestScore = score;
      best = {r,c,why: replies.length ? '위험 수밖에 없어 최선의 방어 후보' :
        ownWinsNext ? '연속 승리 위협 만들기' : '공격과 방어를 함께 평가'};
    }
  }
  if (opWins.length >= 2 && best)
    best.why = '상대 복수 승리 위협 — 완전 방어 불가 가능성';
  return best || {r:7,c:7,why:'중앙 후보'};
}

setInterval(processGame, 200);
requestAnimationFrame(renderLoop);
</script>
